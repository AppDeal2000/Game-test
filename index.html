<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alien Shooter</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Courier New', monospace;
      color: #0ff;
      overflow: hidden;
    }
    #ui {
      display: flex;
      gap: 40px;
      margin-bottom: 8px;
      font-size: 16px;
      letter-spacing: 2px;
    }
    #ui span { color: #0ff; }
    #ui .val { color: #fff; }
    canvas {
      border: 2px solid #0ff;
      box-shadow: 0 0 20px #0ff4, 0 0 60px #0ff1;
      display: block;
    }
    #overlay {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      pointer-events: none;
    }
    #overlay h1 { font-size: 48px; text-shadow: 0 0 20px #0ff; color: #0ff; }
    #overlay h2 { font-size: 28px; color: #ff0; text-shadow: 0 0 10px #ff0; }
    #overlay p  { font-size: 18px; color: #aaa; text-align: center; line-height: 1.6; }
    #overlay .blink {
      font-size: 20px; color: #0ff;
      animation: blink 1s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    #controls {
      margin-top: 6px;
      font-size: 13px;
      color: #555;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div id="ui">
    <span>LEVEL <span class="val" id="lvl">1</span></span>
    <span>SCORE <span class="val" id="score">0</span></span>
    <span>LIVES <span class="val" id="lives">3</span></span>
    <span>TIME <span class="val" id="timer">45</span></span>
  </div>
  <canvas id="c" width="800" height="560"></canvas>
  <div id="controls">MOVE: &#8592; &#8594; &nbsp;|&nbsp; SHOOT: SPACE &nbsp;|&nbsp; PAUSE: P</div>

  <div id="overlay">
    <h1>ALIEN SHOOTER</h1>
    <p>Defend Earth from 3 waves of alien invaders!<br>
       Destroy all aliens before time runs out.</p>
    <div class="blink">PRESS SPACE TO START</div>
  </div>

<script>
const W = 800, H = 560;
const PLAYER_W = 48, PLAYER_H = 28;
const BULLET_W = 4, BULLET_H = 14;
const ALIEN_W = 36, ALIEN_H = 28;

const LEVELS = [
  { rows: 3, cols: 9, speed: 28,  drop: 16, shootEvery: 2200, time: 45, label: "WAVE 1 — SCOUTS" },
  { rows: 4, cols: 10, speed: 38, drop: 18, shootEvery: 1600, time: 42, label: "WAVE 2 — WARRIORS" },
  { rows: 4, cols: 11, speed: 52, drop: 20, shootEvery: 1100, time: 40, label: "WAVE 3 — OVERLORDS" },
];

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const overlay = document.getElementById('overlay');

let state = 'title';
let level = 0, score = 0, lives = 3;
let player, bullets, alienBullets, aliens;
let alienDir = 1, alienMoveTimer = 0, alienShootTimer = 0;
let timeLeft, levelTimer;
let keys = {}, lastTime = 0;
let stars = [];
let explosions = [];

for (let i = 0; i < 120; i++) {
  stars.push({ x: Math.random()*W, y: Math.random()*H, r: Math.random()*1.5+0.3, speed: Math.random()*0.4+0.1 });
}

function initLevel() {
  const cfg = LEVELS[level];
  player = { x: W/2 - PLAYER_W/2, y: H - PLAYER_H - 12, speed: 320, cooldown: 0 };
  bullets = [];
  alienBullets = [];
  explosions = [];
  alienDir = 1;
  alienMoveTimer = 0;
  alienShootTimer = 0;
  timeLeft = cfg.time;
  clearInterval(levelTimer);
  levelTimer = setInterval(() => {
    if (state === 'playing') {
      timeLeft--;
      if (timeLeft <= 0) triggerTimeUp();
    }
  }, 1000);

  const startX = 80, startY = 80;
  const padX = (W - startX*2) / (cfg.cols - 1);
  const padY = 48;
  aliens = [];
  for (let r = 0; r < cfg.rows; r++) {
    for (let c = 0; c < cfg.cols; c++) {
      aliens.push({
        x: startX + c * padX,
        y: startY + r * padY,
        row: r, col: c,
        dead: false,
        animFrame: 0, animTimer: 0,
        hit: false, hitTimer: 0
      });
    }
  }
}

function triggerTimeUp() {
  clearInterval(levelTimer);
  state = 'gameOver';
  setOverlay('<h1>TIME\'S UP!</h1><h2>GAME OVER</h2><p>Score: ' + score + '</p><div class="blink">PRESS SPACE TO RETRY</div>');
}

function alienBounds() {
  const live = aliens.filter(a => !a.dead);
  if (!live.length) return null;
  return {
    minX: Math.min(...live.map(a => a.x)),
    maxX: Math.max(...live.map(a => a.x + ALIEN_W)),
    maxY: Math.max(...live.map(a => a.y + ALIEN_H)),
  };
}

function spawnExplosion(x, y, color) {
  const parts = [];
  for (let i = 0; i < 10; i++) {
    const angle = Math.random() * Math.PI * 2;
    const spd   = Math.random() * 90 + 30;
    parts.push({ x, y, vx: Math.cos(angle)*spd, vy: Math.sin(angle)*spd, life: 1 });
  }
  explosions.push({ parts, color: color || '#0ff', life: 1 });
}

function setOverlay(html) {
  overlay.innerHTML = html;
  overlay.style.display = 'flex';
}
function hideOverlay() {
  overlay.style.display = 'none';
}

document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') e.preventDefault();

  if (e.code === 'Space') {
    if (state === 'title' || state === 'levelStart') {
      if (state === 'title') { level = 0; score = 0; lives = 3; }
      initLevel();
      state = 'playing';
      hideOverlay();
    } else if (state === 'gameOver') {
      level = 0; score = 0; lives = 3;
      setOverlay('<h1>ALIEN SHOOTER</h1><div class="blink">PRESS SPACE TO START</div>');
      state = 'title';
    } else if (state === 'win') {
      level = 0; score = 0; lives = 3;
      setOverlay('<h1>ALIEN SHOOTER</h1><div class="blink">PRESS SPACE TO START</div>');
      state = 'title';
    } else if (state === 'levelClear') {
      level++;
      initLevel();
      state = 'playing';
      hideOverlay();
    }
  }

  if (e.code === 'KeyP') {
    if (state === 'playing') {
      state = 'paused';
      setOverlay('<h2>PAUSED</h2><div class="blink">PRESS P TO RESUME</div>');
    } else if (state === 'paused') {
      state = 'playing';
      hideOverlay();
    }
  }
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

function loop(ts) {
  const dt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;
  updateStars(dt);
  if (state === 'playing') update(dt);
  draw();
  document.getElementById('lvl').textContent   = level + 1;
  document.getElementById('score').textContent = score;
  document.getElementById('lives').textContent = '\u2665'.repeat(lives);
  document.getElementById('timer').textContent = Math.max(0, timeLeft);
  requestAnimationFrame(loop);
}

function updateStars(dt) {
  for (const s of stars) {
    s.y += s.speed * 60 * dt;
    if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
  }
}

function update(dt) {
  const cfg = LEVELS[level];

  if ((keys['ArrowLeft'] || keys['KeyA']) && player.x > 0)
    player.x -= player.speed * dt;
  if ((keys['ArrowRight'] || keys['KeyD']) && player.x + PLAYER_W < W)
    player.x += player.speed * dt;
  player.x = Math.max(0, Math.min(W - PLAYER_W, player.x));

  player.cooldown -= dt;
  if (keys['Space'] && player.cooldown <= 0) {
    bullets.push({ x: player.x + PLAYER_W/2 - BULLET_W/2, y: player.y, speed: 520 });
    player.cooldown = 0.25;
  }

  for (const b of bullets) b.y -= b.speed * dt;
  bullets = bullets.filter(b => b.y > -BULLET_H);

  for (const b of alienBullets) b.y += b.speed * dt;
  alienBullets = alienBullets.filter(b => b.y < H + 10);

  alienMoveTimer += dt;
  const liveCount = aliens.filter(a => !a.dead).length;
  const speedMult = 1 + (1 - liveCount / aliens.length) * 1.4;
  const moveInterval = 1 / (cfg.speed * speedMult / 60);

  if (alienMoveTimer >= moveInterval) {
    alienMoveTimer = 0;
    const bounds = alienBounds();
    if (!bounds) return;
    let drop = false;
    if (bounds.maxX + cfg.speed * moveInterval * alienDir > W - 10) { drop = true; alienDir = -1; }
    if (bounds.minX + cfg.speed * moveInterval * alienDir < 10)      { drop = true; alienDir =  1; }

    for (const a of aliens) {
      if (!a.dead) {
        if (drop) a.y += cfg.drop;
        else      a.x += cfg.speed * moveInterval * alienDir;
        a.animFrame = 1 - a.animFrame;
      }
    }

    if (bounds.maxY >= player.y - 10) {
      loseLife();
      return;
    }
  }

  for (const a of aliens) {
    if (!a.dead) {
      a.animTimer += dt;
      if (a.animTimer > 0.4) { a.animFrame = 1 - a.animFrame; a.animTimer = 0; }
    }
    if (a.hit) { a.hitTimer -= dt; if (a.hitTimer <= 0) a.hit = false; }
  }

  alienShootTimer += dt * 1000;
  if (alienShootTimer >= cfg.shootEvery) {
    alienShootTimer = 0;
    const shooters = aliens.filter(a => !a.dead);
    if (shooters.length) {
      const cols = [...new Set(shooters.map(a => a.col))];
      const col  = cols[Math.floor(Math.random() * cols.length)];
      const inCol = shooters.filter(a => a.col === col);
      const shooter = inCol.reduce((best, a) => a.y > best.y ? a : best);
      alienBullets.push({ x: shooter.x + ALIEN_W/2 - 3, y: shooter.y + ALIEN_H, speed: 220 + level * 60 });
    }
  }

  for (const b of bullets) {
    for (const a of aliens) {
      if (!a.dead && !b.dead &&
          b.x < a.x + ALIEN_W && b.x + BULLET_W > a.x &&
          b.y < a.y + ALIEN_H && b.y + BULLET_H > a.y) {
        a.dead = true;
        b.dead = true;
        spawnExplosion(a.x + ALIEN_W/2, a.y + ALIEN_H/2, level === 2 ? '#f0f' : level === 1 ? '#ff0' : '#0ff');
        score += (level + 1) * 10;
      }
    }
  }
  bullets = bullets.filter(b => !b.dead);

  for (const b of alienBullets) {
    if (!b.dead &&
        b.x < player.x + PLAYER_W && b.x + 6 > player.x &&
        b.y < player.y + PLAYER_H && b.y + 12 > player.y) {
      b.dead = true;
      spawnExplosion(player.x + PLAYER_W/2, player.y + PLAYER_H/2, '#f44');
      loseLife();
      return;
    }
  }
  alienBullets = alienBullets.filter(b => !b.dead);

  for (const ex of explosions) {
    ex.life -= dt * 2;
    for (const p of ex.parts) {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt * 2;
    }
  }
  explosions = explosions.filter(e => e.life > 0);

  if (aliens.every(a => a.dead)) {
    clearInterval(levelTimer);
    score += Math.max(0, timeLeft) * 5;
    if (level >= LEVELS.length - 1) {
      state = 'win';
      setOverlay('<h1>YOU WIN!</h1><h2>EARTH IS SAVED!</h2><p>Final Score: ' + score + '</p><div class="blink">PRESS SPACE TO PLAY AGAIN</div>');
    } else {
      state = 'levelClear';
      setOverlay('<h2>WAVE CLEARED!</h2><p>Time Bonus: +' + (Math.max(0,timeLeft)*5) + '<br>Score: ' + score + '</p><div class="blink">PRESS SPACE FOR NEXT WAVE</div>');
    }
  }
}

function loseLife() {
  lives--;
  player.x = W/2 - PLAYER_W/2;
  bullets = [];
  alienBullets = [];
  if (lives <= 0) {
    clearInterval(levelTimer);
    state = 'gameOver';
    setOverlay('<h2>GAME OVER</h2><p>Score: ' + score + '</p><div class="blink">PRESS SPACE TO RETRY</div>');
  }
}

function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  for (const s of stars) {
    const alpha = 0.3 + s.speed * 1.5;
    ctx.fillStyle = `rgba(150,200,255,${alpha})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
  }

  if (state === 'title' || state === 'win' || state === 'gameOver') return;

  ctx.strokeStyle = '#0ff3';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, H - 2); ctx.lineTo(W, H - 2); ctx.stroke();

  drawPlayer();

  ctx.shadowBlur = 10;
  ctx.shadowColor = '#ff0';
  ctx.fillStyle = '#ff0';
  for (const b of bullets) {
    ctx.fillRect(b.x, b.y, BULLET_W, BULLET_H);
  }

  ctx.shadowColor = '#f44';
  ctx.fillStyle = '#f44';
  for (const b of alienBullets) {
    ctx.beginPath();
    ctx.ellipse(b.x+3, b.y+6, 3, 6, 0, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;

  for (const a of aliens) {
    if (!a.dead) drawAlien(a);
  }

  for (const ex of explosions) {
    for (const p of ex.parts) {
      if (p.life > 0) {
        ctx.globalAlpha = p.life * ex.life;
        ctx.fillStyle = ex.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI*2); ctx.fill();
      }
    }
  }
  ctx.globalAlpha = 1;

  if (state === 'playing') {
    ctx.fillStyle = '#0ff2';
    ctx.font = '13px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText(LEVELS[level].label, W/2, H - 4);
  }
}

function drawPlayer() {
  const x = player.x, y = player.y;
  ctx.shadowBlur = 12; ctx.shadowColor = '#0f8';
  ctx.fillStyle = '#0f83';
  ctx.fillRect(x + PLAYER_W/2 - 4, y + PLAYER_H, 8, 6);
  ctx.fillStyle = '#0cf';
  ctx.beginPath();
  ctx.moveTo(x + PLAYER_W/2, y);
  ctx.lineTo(x + PLAYER_W - 4, y + PLAYER_H);
  ctx.lineTo(x + 4, y + PLAYER_H);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#07a';
  ctx.beginPath();
  ctx.moveTo(x + PLAYER_W/2 - 8, y + PLAYER_H - 10);
  ctx.lineTo(x, y + PLAYER_H + 4);
  ctx.lineTo(x + PLAYER_W/2 - 2, y + PLAYER_H - 2);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x + PLAYER_W/2 + 8, y + PLAYER_H - 10);
  ctx.lineTo(x + PLAYER_W, y + PLAYER_H + 4);
  ctx.lineTo(x + PLAYER_W/2 + 2, y + PLAYER_H - 2);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(x + PLAYER_W/2, y + PLAYER_H*0.55, 4, 5, 0, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;
}

function drawAlien(a) {
  const x = Math.round(a.x), y = Math.round(a.y);
  const f = a.animFrame;
  const colors = [['#0ff','#09c'],['#ff0','#aa0'],['#f0f','#90c']];
  const [bright, dark] = colors[Math.min(a.row, 2)];
  if (a.hit) {
    ctx.shadowBlur = 20; ctx.shadowColor = '#fff';
    ctx.fillStyle = '#fff';
  } else {
    ctx.shadowBlur = 6; ctx.shadowColor = bright;
    ctx.fillStyle = bright;
  }
  ctx.beginPath();
  ctx.ellipse(x + ALIEN_W/2, y + ALIEN_H/2, ALIEN_W/2 - 2, ALIEN_H/2 - 4, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(x + 10, y + 12, 4, 5, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x + 26, y + 12, 4, 5, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#f00';
  ctx.beginPath(); ctx.arc(x + 10 + (f?1:-1), y + 13, 2, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x + 26 + (f?1:-1), y + 13, 2, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = dark;
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x + 8, y + 4); ctx.lineTo(x + 4, y - 4 + (f?2:0)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + 14, y + 2); ctx.lineTo(x + 12, y - 6 + (f?0:2)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + 28, y + 4); ctx.lineTo(x + 32, y - 4 + (f?2:0)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + 22, y + 2); ctx.lineTo(x + 24, y - 6 + (f?0:2)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + 8,  y + ALIEN_H - 2); ctx.lineTo(x + 4,  y + ALIEN_H + (f?5:3)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + 18, y + ALIEN_H - 2); ctx.lineTo(x + 18, y + ALIEN_H + (f?3:5)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + 28, y + ALIEN_H - 2); ctx.lineTo(x + 32, y + ALIEN_H + (f?5:3)); ctx.stroke();
  ctx.shadowBlur = 0;
}

setOverlay('<h1>ALIEN SHOOTER</h1><p>Destroy all aliens before time runs out!<br>3 waves stand between you and victory.</p><div class="blink">PRESS SPACE TO START</div>');
requestAnimationFrame(loop);
</script>
</body>
</html>
